version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rcms-postgres
    environment:
      POSTGRES_DB: rcms_db
      POSTGRES_USER: rcms_user
      POSTGRES_PASSWORD: rcms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rcms-network

  backend:
    build: .
    container_name: rcms-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://rcms_user:rcms_password@postgres:5432/rcms_db
      DB_SSL: "false"
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - rcms-network
    restart: unless-stopped

networks:
  rcms-network:
    driver: bridge

volumes:
  postgres_data:
